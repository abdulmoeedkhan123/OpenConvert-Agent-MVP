[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openconvert-agent"
version = "0.1.0"
description = "Local-first open-source file conversion assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenConvert contributors"}]
dependencies = [
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
openconvert = "openconvert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
